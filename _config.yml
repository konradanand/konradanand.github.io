# ---------------------------------
# Site settings
# ---------------------------------

title: "Konrad Anand"
title_separator: "·"
description: "Konrad Anand is a postdoctoral researcher working in probability, combinatorics, randomized algorithms, counting, and sampling."
email: konrad.anand@cs.ox.ac.uk
name: "Konrad Anand"
baseurl: "" # subpath of the site, e.g., /blog
url: "https://konradanand.github.io" # base hostname & protocol
locale: en-GB
timezone: "Europe/London"
repository: "konradanand/konradanand.github.io"
minimal_mistakes_skin: "default"
og_image: "/assets/images/social-card.png"

# ---------------------------------
# Social & Author information
# ---------------------------------

author:
  name: "Konrad Anand"
  avatar: "/assets/images/headshot.jpg"
  bio: "Postdoctoral researcher in Computer Science at the University of Oxford."
  location: "Oxford, UK"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:konrad.anand@cs.ox.ac.uk"
    - label: "ORCID"
      icon: "fas fa-id-badge"
      url: "https://orcid.org/0000-0001-5778-9397"
    - label: "DBLP"
      icon: "fas fa-book"
      url: "https://dblp.org/pid/264/4971"
# ---------------------------------
# Build and output settings
# ---------------------------------

#theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes

markdown: kramdown
paginate: 5 # Number of posts per page
paginate_path: "/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag
  
# Sidebar settings
sidebar:
  avatar: true
  author_bio: true
  nav: "docs"  # Ensure this matches a file in _data/navigation.yml if you have one
  position: "left"  # Set the sidebar position to the left



# ---------------------------------
# Exclude/Include
# ---------------------------------

exclude: []
include:
  - _pages

# ---------------------------------
# Layout defaults
# ---------------------------------

defaults:
  # Posts layout defaults
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  # Pages layout defaults
  - scope:
      path: "/_pages/"
      type: pages
    values:
      layout: archive
      author_profile: true
